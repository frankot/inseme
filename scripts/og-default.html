<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Work+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
@font-face{font-family:"WS";src:url(../public/fonts/WorkSans-Regular.ttf)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#232823}
.wrap{display:grid;grid-template-columns:560px 640px;height:630px}
.panel{background:#232823;color:#F7F5EF;padding:64px 64px 56px 72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{width:150px;filter:brightness(0) invert(1);opacity:.96}
.tag{margin-top:12px;font:500 13px/1 "Work Sans","WS";letter-spacing:.26em;text-transform:uppercase;color:rgba(247,245,239,.6)}
h1{font:400 56px/1.06 Jost;letter-spacing:-.03em;margin-top:-8px}
h1 em{font-style:normal;color:#9DBE8F}
.foot{display:flex;align-items:center;gap:16px;padding-top:24px;border-top:1px solid rgba(247,245,239,.18);font:400 28px/1 "Work Sans","WS";color:rgba(247,245,239,.62)}
.foot span,.foot b{white-space:nowrap}.foot{flex-wrap:wrap;row-gap:10px}.foot .sub{flex-basis:100%;padding-left:25px;font-size:19px;letter-spacing:.01em}.foot b{font-weight:500;color:#F7F5EF;letter-spacing:.01em}
.dot{width:9px;height:9px;background:#9DBE8F;flex:none}
.photo{background:url(../public/placeholder/dom-taras.webp) 38% 60%/cover;filter:saturate(.92)}
</style></head><body><div class="wrap">
<div class="panel">
 <div><img class="logo" src="../public/placeholder/logo-insieme.png"><div class="tag">Magdalenka</div></div>
 <h1>Prywatny ośrodek leczenia uzależnień <em>pod&nbsp;Warszawą</em></h1>
 <div class="foot"><span class="dot"></span><b>669 916 005</b><span class="sub">pierwsza rozmowa bezpłatna</span></div>
</div>
<div class="photo"></div>
</div></body></html>
